name: DWS 持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: 构建、测试与质量检查
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装固定版本 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: 检查仓库体积
        shell: pwsh
        run: .\eng\Check-RepositorySize.ps1

      - name: 恢复依赖并执行安全审计
        shell: pwsh
        run: dotnet restore .\JayTom.Dws.sln -p:Platform=x64

      - name: Release 构建
        shell: pwsh
        run: dotnet build .\JayTom.Dws.sln -c Release -p:Platform=x64 --no-restore -m:1 -p:UseSharedCompilation=false

      - name: 运行代码质量守卫
        shell: pwsh
        run: dotnet run --project .\eng\JayTom.Dws.CodeQualityGuard\JayTom.Dws.CodeQualityGuard.csproj -c Release --no-build --no-restore -- . .\eng\CodeQualityBaseline.json

      - name: 运行回归测试
        shell: pwsh
        run: dotnet test .\JayTom.Dws.Tests\JayTom.Dws.Tests.csproj -c Release -p:Platform=x64 --no-build --no-restore

      - name: 检查格式错误
        shell: pwsh
        run: git diff --check
