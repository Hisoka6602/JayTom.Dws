# Ocrgve SDK config file

# log_level -- 选填，日志级别(TRACE, DEBUG, INFO, WARN, ERR, CRITICAL, OFF)
log_level : ERR

# log_path -- 选填，日志输出路径
# log_path : /sdcard/log.txt

# console_log -- 选填，是否输出控制台（Android下为logcat）日志
console_log : false

# metallib -- metallib文件路径，选填，在加载mml GPU模型时需要用到
# metallib : metallib.metallib

#公共配置
object_type = waybill
json_path = ocr_model_v1_graph_waybill.json

#条形码开关控制参数 bar_code  true 输出  false 不输出
bar_code = true
#运单号数字开关控制参数 waybill_number  true 输出  false 不输出
waybill_number = true
#三段码开关控制参数 three_segment_code  true 输出  false 不输出
three_segment_code = true

#收件人姓名开关控制参数 recipient_name true 输出  false 不输出
recipient_name = true
#收件人手机号开关控制参数 recipient_phone  true 输出  false 不输出
recipient_phone = true
#收件人地址开关控制参数 recipient_addr  true 输出  false 不输出
recipient_addr = true

#寄件人姓名开关控制参数 sender_name true 输出  false 不输出
sender_name = true
#寄件人手机号开关控制参数 sender_phone  true 输出  false 不输出
sender_phone = true
#寄件人地址开关控制参数 sender_addr  true 输出  false 不输出
sender_addr = true

#虚拟面单开关控制参数 virtual_number true 输出  false 不输出
virtual_number = true



#主体检测模块配置

ocrgvesdk.maindetect.model = maindetect.paddle.encrypted
ocrgvesdk.maindetect.powermode = 0
ocrgvesdk.maindetect.threadnums = 1

#主体分类模块配置
ocrgvesdk.mainclassify.model = mainclassify.paddle.encrypted
ocrgvesdk.mainclassify.powermode = 0
ocrgvesdk.mainclassify.threadnums = 1

#四方向模块配置
ocrgvesdk.direct.model = direct.paddle.encrypted
ocrgvesdk.direct.powermode = 0
ocrgvesdk.direct.threadnums = 1

#质量检测模块配置
ocrgvesdk.quality.model = quality.paddle.encrypted
ocrgvesdk.quality.powermode = 0
ocrgvesdk.quality.threadnums = 1

#风险检测模块配置
ocrgvesdk.risk.model = risk.paddle.encrypted
ocrgvesdk.risk.powermode = 0
ocrgvesdk.risk.threadnums = 1

#头像检测模块配置
ocrgvesdk.head.model = head.paddle.encrypted
ocrgvesdk.head.powermode = 0
ocrgvesdk.head.threadnums = 1

#行检测模块配置
ocrgvesdk.linedetect.model = linedetect_23.paddle.encrypted
ocrgvesdk.linedetect.powermode = 0
ocrgvesdk.linedetect.threadnums = 1

#二维码检测模块配置
ocrgvesdk.qrcode.model = qrcode.paddle.encrypted
ocrgvesdk.qrcode.powermode = 0
ocrgvesdk.qrcode.threadnums = 1

#识别模块配置
ocrgvesdk.linerecga.model = linerecga.paddle.encrypted
ocrgvesdk.linerecga.powermode = 0
ocrgvesdk.linerecga.threadnums = 1

#识别模块配置
ocrgvesdk.linerecgb.model = linerecgb.paddle.encrypted
ocrgvesdk.linerecgb.powermode = 0
ocrgvesdk.linerecgb.threadnums = 1

#识别模块配置
ocrgvesdk.linerecgc.model = linerecgc.paddle.encrypted
ocrgvesdk.linerecgc.powermode = 0
ocrgvesdk.linerecgc.threadnums = 1

ocrgvesdk.postprocess.opentag = 0
ocrgvesdk.postprocess.model = postprocess.paddle.encrypted
ocrgvesdk.postprocess.powermode = 0
ocrgvesdk.postprocess.threadnums = 1
